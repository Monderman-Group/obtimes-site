name: Verify mobile projects

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-verify.yml'
      - 'android/**'
      - 'app/**'
      - 'assets/app.*'
      - 'assets/app-catalog.json'
      - 'capacitor.config.json'
      - 'ios/**'
      - 'mobile/**'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/prepare_mobile.mjs'
      - 'scripts/prepare_native_assets.mjs'

permissions:
  contents: read

jobs:
  android:
    name: Android debug bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out the publication
        uses: actions/checkout@v7
      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Use Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install exact dependencies
        run: npm ci
      - name: Stage and sync the native shell
        run: npm run mobile:sync
      - name: Compile an Android App Bundle
        working-directory: android
        run: ./gradlew bundleDebug
      - name: Preserve the verification bundle
        uses: actions/upload-artifact@v7
        with:
          name: obtimes-android-debug
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error

  ios:
    name: iOS simulator build
    runs-on: macos-26
    steps:
      - name: Check out the publication
        uses: actions/checkout@v7
      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Stage and sync the native shell
        run: npm run mobile:sync
      - name: Compile without release signing
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -sdk iphonesimulator
          -configuration Debug
          -derivedDataPath "$RUNNER_TEMP/OBTDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
