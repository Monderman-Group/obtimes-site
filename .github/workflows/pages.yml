name: Publish On Borrowed Times

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the publication
        uses: actions/checkout@v6
      - name: Validate public files
        run: python3 scripts/validate_site.py
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Stage public files for the Pages base path
        run: python3 scripts/prepare_pages.py --base-path "${{ steps.pages.outputs.base_path }}" --output _site
      - name: Upload the static site
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Wait for the uploaded artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          url = f"{os.environ['GH_API_URL']}/repos/{os.environ['GH_REPOSITORY']}/actions/runs/{os.environ['GH_RUN_ID']}/artifacts?per_page=100"
          artifact_id = int(os.environ['PAGES_ARTIFACT_ID'])
          artifact_name = os.environ['PAGES_ARTIFACT_NAME']
          for attempt in range(60):
              request = urllib.request.Request(url, headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      artifacts = json.load(response)['artifacts']
                  if any(item['id'] == artifact_id and item['name'] == artifact_name and not item['expired'] for item in artifacts):
                      print(f'Artifact {artifact_name} is visible. Allowing the Actions Results index to catch up.', flush=True)
                      time.sleep(20)
                      break
              except urllib.error.HTTPError as error:
                  if error.code not in (408, 429, 500, 502, 503, 504):
                      raise
              except (urllib.error.URLError, TimeoutError):
                  pass
              print(f'Waiting for uploaded artifact ({attempt + 1}/60).', flush=True)
              time.sleep(2)
          else:
              raise SystemExit('The uploaded Pages artifact did not become available.')
          PY
      - name: Publish GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
