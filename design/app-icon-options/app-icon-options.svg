<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">Five On Borrowed Times app icon directions</title>
  <desc id="desc">Five app icon concepts shown at equal size: Highlighted B, Marked Page, Editorial Margin, Open Folio, and Pull Quote.</desc>
  <rect width="1600" height="1160" fill="#f6f7f2"/>
  <text x="80" y="82" fill="#191b19" font-family="Georgia,serif" font-size="48">On Borrowed Times — app icon directions</text>
  <text x="82" y="126" fill="#566052" font-family="Arial,sans-serif" font-size="22" letter-spacing="1">BLACK · PAPER · HIGHLIGHTER YELLOW</text>

  <g transform="translate(72 176)">
    <rect width="448" height="426" rx="24" fill="#fff" stroke="#d8ddd2" stroke-width="2"/>
    <svg x="84" y="36" width="280" height="280" viewBox="0 0 1024 1024">
      <rect width="1024" height="1024" rx="210" fill="#191b19"/>
      <path d="M150 240 332 222 520 235 704 216 870 238 858 790 692 807 514 792 328 812 142 786Z" fill="#f5e329"/>
      <text x="510" y="744" fill="#191b19" font-family="Georgia,serif" font-size="650" font-weight="700" text-anchor="middle">B</text>
    </svg>
    <text x="34" y="356" fill="#191b19" font-family="Georgia,serif" font-size="30">1. Highlighted B</text>
    <text x="34" y="392" fill="#566052" font-family="Arial,sans-serif" font-size="18">The current identity, stripped to what survives.</text>
  </g>

  <g transform="translate(576 176)">
    <rect width="448" height="426" rx="24" fill="#fff" stroke="#d8ddd2" stroke-width="2"/>
    <svg x="84" y="36" width="280" height="280" viewBox="0 0 1024 1024">
      <rect width="1024" height="1024" rx="210" fill="#191b19"/>
      <path d="M220 140H700L820 260V860H220Z" fill="#fafbf7"/>
      <path d="M700 140V260H820Z" fill="#d8ddd2"/>
      <rect x="310" y="330" width="404" height="74" rx="8" fill="#191b19"/>
      <path d="M282 466 438 451 602 462 754 448 746 594 592 608 436 598 286 612Z" fill="#f5e329"/>
      <rect x="310" y="492" width="404" height="74" rx="8" fill="#191b19"/>
      <rect x="310" y="652" width="316" height="74" rx="8" fill="#191b19"/>
    </svg>
    <text x="34" y="356" fill="#191b19" font-family="Georgia,serif" font-size="30">2. Marked Page</text>
    <text x="34" y="392" fill="#566052" font-family="Arial,sans-serif" font-size="18">Reading and argument, without literal words.</text>
  </g>

  <g transform="translate(1080 176)">
    <rect width="448" height="426" rx="24" fill="#fff" stroke="#d8ddd2" stroke-width="2"/>
    <svg x="84" y="36" width="280" height="280" viewBox="0 0 1024 1024">
      <rect width="1024" height="1024" rx="210" fill="#fafbf7"/>
      <rect x="160" y="155" width="92" height="714" rx="10" fill="#191b19"/>
      <rect x="335" y="252" width="474" height="82" rx="8" fill="#191b19"/>
      <path d="M302 420 456 405 622 417 846 399 836 574 646 590 454 578 306 594Z" fill="#f5e329"/>
      <rect x="335" y="462" width="474" height="82" rx="8" fill="#191b19"/>
      <rect x="335" y="655" width="350" height="82" rx="8" fill="#191b19"/>
    </svg>
    <text x="34" y="356" fill="#191b19" font-family="Georgia,serif" font-size="30">3. Editorial Margin</text>
    <text x="34" y="392" fill="#566052" font-family="Arial,sans-serif" font-size="18">Serious, editorial, and recognizably marked.</text>
  </g>

  <g transform="translate(324 658)">
    <rect width="448" height="426" rx="24" fill="#fff" stroke="#d8ddd2" stroke-width="2"/>
    <svg x="84" y="36" width="280" height="280" viewBox="0 0 1024 1024">
      <rect width="1024" height="1024" rx="210" fill="#191b19"/>
      <path d="M130 246 466 316V824L130 750Z" fill="#fafbf7"/>
      <path d="M558 316 894 246V750L558 824Z" fill="#fafbf7"/>
      <path d="M488 305H536V834L512 856 488 834Z" fill="#d8ddd2"/>
      <rect x="210" y="418" width="190" height="36" rx="6" fill="#191b19"/>
      <rect x="210" y="510" width="190" height="36" rx="6" fill="#191b19"/>
      <path d="M612 446 714 432 826 444 814 568 708 580 610 570Z" fill="#f5e329"/>
      <rect x="630" y="482" width="154" height="42" rx="6" fill="#191b19"/>
      <rect x="630" y="622" width="154" height="36" rx="6" fill="#191b19"/>
    </svg>
    <text x="34" y="356" fill="#191b19" font-family="Georgia,serif" font-size="30">4. Open Folio</text>
    <text x="34" y="392" fill="#566052" font-family="Arial,sans-serif" font-size="18">The clearest expression of the reader itself.</text>
  </g>

  <g transform="translate(828 658)">
    <rect width="448" height="426" rx="24" fill="#fff" stroke="#d8ddd2" stroke-width="2"/>
    <svg x="84" y="36" width="280" height="280" viewBox="0 0 1024 1024">
      <rect width="1024" height="1024" rx="210" fill="#fafbf7"/>
      <path d="M112 262 334 242 518 257 714 236 910 260 896 778 712 798 514 782 330 804 104 780Z" fill="#f5e329"/>
      <text x="510" y="758" fill="#191b19" font-family="Georgia,serif" font-size="690" font-weight="700" text-anchor="middle">“</text>
    </svg>
    <text x="34" y="356" fill="#191b19" font-family="Georgia,serif" font-size="30">5. Pull Quote</text>
    <text x="34" y="392" fill="#566052" font-family="Arial,sans-serif" font-size="18">The boldest and most purely editorial direction.</text>
  </g>
</svg>
