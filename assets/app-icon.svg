  <rect width="1024" height="1024" rx="190" fill="#191b19"/>
  <path d="M207 336 360 322 514 330 669 315 820 334 812 690 661 704 510 693 357 707 200 687Z" fill="#f5e329"/>
  <text x="512" y="260" fill="#fafbf7" font-family="Georgia,serif" font-size="98" text-anchor="middle" letter-spacing="18">ON</text>
  <text x="512" y="623" fill="#11140f" font-family="Georgia,serif" font-size="340" text-anchor="middle">B</text>
  <text x="512" y="829" fill="#fafbf7" font-family="Georgia,serif" font-size="92" text-anchor="middle" letter-spacing="14">TIMES</text>
</svg>
